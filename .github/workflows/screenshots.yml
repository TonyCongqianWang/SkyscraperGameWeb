name: Screenshot previews

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Capture responsive screenshots
        run: node tests/screenshots.cjs
      - name: Upload screenshot previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skyscrapers-screenshots
          path: artifacts/screenshots/
          retention-days: 14
          if-no-files-found: error
