name: Screenshot previews

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-24.04 # Pinned: preinstalled Google Chrome, no browser download
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Use preinstalled Chrome with Playwright Core
        run: |
          command -v google-chrome
          google-chrome --version
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.57.0
      - name: Capture responsive screenshots
        run: node tests/screenshots.cjs
      - name: Upload screenshot previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: skyscrapers-screenshots
          path: artifacts/screenshots/
          retention-days: 14
          if-no-files-found: warn
