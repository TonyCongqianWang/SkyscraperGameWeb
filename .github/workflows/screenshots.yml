name: Screenshot previews

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-24.04 # Playwright 1.57 Chromium does not support Ubuntu 26.04 yet
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Install browser
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Capture responsive screenshots
        run: node tests/screenshots.cjs
      - name: Upload screenshot previews
        uses: actions/upload-artifact@v7
        with:
          name: skyscrapers-screenshots
          path: artifacts/screenshots/
          retention-days: 14
          if-no-files-found: error
